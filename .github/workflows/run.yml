name: Executar Robo Afiliado

on:
  workflow_dispatch: # Permite que você execute manualmente quando quiser
  schedule:
    - cron: '0 12 * * *' # Roda automaticamente todo dia às 09:00 da manhã (horário de Brasília)

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Concede permissão explícita de leitura e escrita para o bot atualizar o CSV
    permissions:
      contents: write

    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Executar o robô de afiliados
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python main.py
