name: Executar Robo Afiliado Global

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 12 * * *' # Executa automaticamente todos os dias às 12:00 UTC (9h no horário de Brasília)
  workflow_dispatch: # Permite disparar manualmente pela aba Actions no GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client requests google-genai

      - name: Executar Robô
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
